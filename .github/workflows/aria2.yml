name: Build aria2 container

on:
  pull_request:
    paths:
      - aria2/**
      - .github/workflows/aria2.yml
      - .gitattributes
  push:
    branches: [main]
    tags: [aria2-v*]
    paths:
      - aria2/**
      - .github/workflows/aria2.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman
      - name: Build OCI image
        run: |
          sudo podman build --format oci --pull=always \
            --file aria2/Containerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag localhost/aria2:ci aria2
      - name: Test downloads, restart recovery, RPC and disabled protocols
        env:
          CONTAINER_ENGINE: sudo podman
        run: python3 aria2/tests/smoke.py localhost/aria2:ci
      - name: Push tested architecture
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref_name == github.event.repository.default_branch ||
          startsWith(github.ref, 'refs/tags/aria2-v'))
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/aria2"
          build_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET_ARCH}"
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin
          sudo podman push --format oci localhost/aria2:ci "docker://${image}:${build_tag}"

  publish:
    name: Publish multi-architecture OCI image
    needs: build-and-test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref, 'refs/tags/aria2-v'))
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman
      - name: Assemble and publish manifest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/aria2"
          build_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin
          sudo podman manifest create localhost/aria2-release
          for arch in amd64 arm64; do
            sudo podman manifest add localhost/aria2-release "docker://${image}:${build_tag}-${arch}"
          done
          sudo podman manifest push --all --format oci localhost/aria2-release \
            "docker://${image}:sha-${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF" == refs/tags/aria2-v* ]]; then
            tag="${GITHUB_REF_NAME#aria2-v}"
          else
            tag=latest
          fi
          sudo podman manifest push --all --format oci localhost/aria2-release "docker://${image}:${tag}"
          printf 'Published `%s:%s` (amd64 and arm64).\n' "$image" "$tag" >> "$GITHUB_STEP_SUMMARY"

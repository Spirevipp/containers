name: Publish aria2 container

on:
  push:
    branches: [main]
    tags: [aria2-v*]
    paths:
      - aria2/**
      - .github/workflows/aria2.yml
      - .github/workflows/build-container.yml
      - .github/scripts/containers.py
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-aria2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aria2:
    if: >-
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref, 'refs/tags/aria2-v')
    uses: ./.github/workflows/build-container.yml
    with:
      container: aria2
      publish: true
      version_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

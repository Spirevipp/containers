name: Container checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Select affected containers
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            matrix=$(python3 .github/scripts/containers.py discover --base "$BASE_SHA")
          else
            matrix=$(python3 .github/scripts/containers.py discover)
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          any=$(python3 -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["container"])).lower())' "$matrix")
          printf 'any=%s\n' "$any" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate update configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate manifests, selection logic and checksum tests
        run: |
          python3 .github/scripts/test_containers.py
          python3 .github/scripts/containers.py validate
          node .github/scripts/test-renovate.cjs
      - name: Validate Renovate schema
        run: |
          version=$(node -e 'const fs=require("fs"); console.log(fs.readFileSync(".github/workflows/updates.yml","utf8").match(/RENOVATE_VERSION: "([0-9.]+)"/)[1])')
          npm exec --yes --package="renovate@${version}" -- renovate-config-validator --strict .github/renovate.cjs

  containers:
    name: Check ${{ matrix.container }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/build-container.yml
    with:
      container: ${{ matrix.container }}

  required:
    name: Container CI
    if: always()
    needs: [discover, validate, containers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all relevant checks to pass
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.containers.result }}
          HAS_CONTAINERS: ${{ needs.discover.outputs.any }}
        run: |
          [[ "$DISCOVER_RESULT" == success && "$VALIDATE_RESULT" == success ]]
          if [[ "$HAS_CONTAINERS" == true ]]; then
            [[ "$BUILD_RESULT" == success ]]
          else
            [[ "$BUILD_RESULT" == skipped ]]
          fi

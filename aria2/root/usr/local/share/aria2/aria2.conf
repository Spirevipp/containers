# File downloads only. This binary has no BitTorrent or Metalink support.
dir=/Downloads
continue=true
always-resume=true
allow-overwrite=false
allow-piece-length-change=false

# Patient retries for slow or temporarily unavailable servers.
max-concurrent-downloads=3
max-tries=0
retry-wait=60
connect-timeout=60
timeout=120
lowest-speed-limit=0
split=1
max-connection-per-server=1
file-allocation=none

# Preserve the queue and partial-download metadata between restarts.
input-file=/config/aria2.session
save-session=/config/aria2.session
save-session-interval=30
auto-save-interval=30

# The container keeps RPC on port 6800. The secret is set at startup.
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-allow-origin-all=true

console-log-level=notice
log-level=warn
show-console-readout=false
